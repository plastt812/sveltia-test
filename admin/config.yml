# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json

backend:
  name: github
  repo: plastt812/sveltia-test
  branch: main

site_url: https://plastt812.github.io/sveltia-test
media_folder: assets/img
public_folder: assets/img

collections:
  - name: site
    label: Site content
    files:
      - name: home
        label: Home page
        file: content/site.json
        format: json
        fields:
          - label: Hero
            name: hero
            widget: object
            fields:
              - { label: Kicker, name: kicker, widget: string }
              - { label: Title, name: title, widget: string }
              - { label: Subtitle, name: subtitle, widget: text }
          - label: Stats
            name: stats
            widget: list
            fields:
              - { label: Value, name: value, widget: string }
              - { label: Label, name: label, widget: string }
          - label: Brands
            name: brands
            widget: list
            fields:
              - { label: Name, name: name, widget: string }
              - { label: Description, name: description, widget: text }
              - { label: Image, name: image, widget: image }
              - { label: Link, name: link, widget: string }
          - label: Contact
            name: contact
            widget: object
            fields:
              - { label: Email, name: email, widget: string }
              - label: Phone numbers
                name: phones
                widget: list
                field: { label: Number, name: number, widget: string }
              - { label: Address, name: address, widget: string }
              - { label: Instagram URL, name: instagram, widget: string }
              - { label: LinkedIn URL, name: linkedin, widget: string }